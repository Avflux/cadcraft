[package]
name = "cadcraft-cli"
description = "CADCraft command-line tool: info, convert, run scripts, export, commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["anacad", "arqelog"]
anacad = ["dep:anacad-cadcraft"]
# Os tres dominios do setor eletrico em um crate (projeto irmao em ../arqelog).
arqelog = ["dep:arqelog-cadcraft"]

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-mcp = { workspace = true }
cadcraft-render = { workspace = true }
serde_json = { workspace = true }
# Plugins: crates do dominio (projetos irmaos em ../anacad e ../arqelog).
anacad-cadcraft = { path = "../../../anacad/crates/cadcraft", optional = true }
arqelog-cadcraft = { path = "../../../arqelog/crates/cadcraft", optional = true }
