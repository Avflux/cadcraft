[package]
name = "cadcraft-engine"
description = "CADCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# O modulo AnaCAD (comandos `anacad.*` e o banco `.db` do projeto irmao). Os apps ligam; o nucleo
# nao, para o cadcraft continuar sendo o upstream generico.
anacad = ["dep:anacad-core", "dep:anacad-data"]

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
# Nucleo do dominio anacad (projeto irmao em ../anacad): dependencias opcionais, ligadas pela
# feature `anacad`.
anacad-core = { path = "../../../anacad/crates/core", optional = true }
anacad-data = { path = "../../../anacad/crates/data", optional = true }
cadcraft-constraints = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
cadcraft-io = { workspace = true }
